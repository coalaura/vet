name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  project_name: vet

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build
      id: build
      uses: coalaura/build@v1
      with:
        os: ${{ matrix.goos }}
        arch: ${{ matrix.goarch }}
        optimization: compatible
        generate: false
        package: .
        output: dist/${{ env.project_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        go-flags: |
          -ldflags=-X main.Version=${{ github.ref_name }}

    - name: Sign
      id: sign
      uses: coalaura/sign@v1
      with:
        path: ${{ steps.build.outputs.path }}
        key: ${{ secrets.COALAURA_PFX }}
        passphrase: ${{ secrets.COALAURA_PFX_PASSWORD }}
        chain: |
          https://wiese2.org/pki/issuing.pem
          https://wiese2.org/pki/root.pem

    - name: Upload signed binary
      uses: actions/upload-artifact@v7
      with:
        name: signed-${{ env.project_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        path: ${{ steps.sign.outputs.path }}
        if-no-files-found: error
        retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
    - name: Download signed binaries
      uses: actions/download-artifact@v8
      with:
        pattern: signed-${{ env.project_name }}-*
        path: dist
        merge-multiple: true

    - name: Generate checksums
      working-directory: dist
      run: sha256sum -b "${project_name}"-* > SHA256SUMS

    - name: Attest binaries
      uses: actions/attest@v4
      with:
        subject-checksums: dist/SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/${{ env.project_name }}-*
          dist/SHA256SUMS
        name: "Release ${{ github.ref_name }}"
        fail_on_unmatched_files: true
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
